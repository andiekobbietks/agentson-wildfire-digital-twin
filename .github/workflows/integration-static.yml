name: Integration static checks

on:
  push:
    paths:
      - "integrations/**"
      - ".github/workflows/integration-static.yml"
  pull_request:
    paths:
      - "integrations/**"
      - ".github/workflows/integration-static.yml"

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile integration Python sources
        run: |
          python -m compileall -q integrations/ros2
          python -m compileall -q integrations/agentson
